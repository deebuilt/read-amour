name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without pushing a commit.
  workflow_dispatch:

# Read the repo, write a Pages deployment, and mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is not cancelled, so a push during a
# deploy still ships rather than being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `dist` is the entire deployed site, which is why the custom domain's
      # CNAME lives in `public/` rather than the repo root: Vite copies
      # `public/` into `dist` verbatim, and anything outside `dist` is not
      # published at all.
      #
      # Setting the domain through the Pages settings UI writes CNAME to the
      # repo root, where this workflow would never see it — the next deploy
      # would ship a site with no CNAME, and GitHub clears the custom domain
      # when it finds none. The domain would drop on every push.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
